<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dấu và Trao</title>
    <link rel="stylesheet" href="style.css">
    <!-- Thêm font chữ phong cách viết tay (Cursive) từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="main-container">
        <!-- Header: Logo và Thanh tìm kiếm -->
        <header class="header">
            <h1 class="logo">Dấu và Trao</h1>
            <div class="header-right">
                <div class="avatar-badge">🎨</div>
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" placeholder="">
                </div>
            </div>
        </header>

        <!-- Nội dung chính -->
        <div class="content-body">
            <!-- Cột trái: Khung vẽ/ảnh -->
            <div class="left-box">
                <div class="canvas-frame">
                    <p class="canvas-text">Vẽ gửi<br>người ấy...</p>
                </div>
            </div>

            <!-- Cột giữa: Thanh công cụ vẽ -->
            <div class="toolbar">
                <div class="tool-icons">
                    <span>✏️</span>
                    <span>📝</span>
                </div>
                <div class="color-palette">
                    <span class="color-dot red"></span>
                    <span class="color-dot orange"></span>
                    <span class="color-dot yellow"></span>
                    <span class="color-dot green"></span>
                    <span class="color-dot cyan"></span>
                    <span class="color-dot purple"></span>
                </div>
                <div class="toolbar-dropdown">▼</div>
            </div>

            <!-- Cột phải: Gửi giai điệu và tâm tư -->
            <div class="right-box">
                <h2>Gửi giai điệu và tâm tư</h2>
                
                <!-- Mục 1 -->
                <div class="form-group">
                    <label>1. Gửi đến ai đó</label>
                    <input type="text" placeholder="Tên biệt danh..." class="input-field">
                </div>

                <!-- Mục 2 -->
                <div class="form-group">
                    <label>2. Tìm bài hát</label>
                    <div class="audio-player">
                        <span class="disc">💿</span>
                        <div class="waveform"></div>
                    </div>
                </div>

                <!-- Mục 3 -->
                <div class="form-group">
                    <label>3. Lời nhắn</label>
                    <textarea placeholder="Viết những điều bạn muốn nhắn gửi..." class="textarea-field"></textarea>
                </div>
            </div>
        </div>

        <!-- Chân trang (Footer) -->
        <footer class="footer">
            <div class="contact-info">
                <p>Số điện thoại hỗ trợ: 0983 456 789</p>
                <p>Facebook: D&T</p>
                <p>Gmail: dauvatrao@gmail.com</p>
                <p>Instagram: Dau VA Trao (wth love)</p>
            </div>
            <div class="footer-right">
                <p>Tik tok: TRAO</p>
                <div class="heart-icon">❤️</div>
            </div>
        </footer>
    </div>

</body>
</html>
